name: Verificar Supabase DEV 001–014

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-dev-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'tablerocontable-paris/TABLERO-CONTABLE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject an unauthorized repository or branch
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == 'tablerocontable-paris/TABLERO-CONTABLE' ]]
          [[ "$REF" == 'refs/heads/main' ]]

      - name: Checkout main without a write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase_2.121.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            'https://github.com/supabase/cli/releases/download/v2.121.0/supabase_2.121.0_linux_amd64.tar.gz' \
            --output "$archive"
          echo '4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-cli" supabase
          chmod 0755 "$RUNNER_TEMP/supabase-cli/supabase"
          [[ "$("$RUNNER_TEMP/supabase-cli/supabase" --version)" == '2.121.0' ]]

      - name: Verify hash lock and stage only migrations 001–014
        run: |
          set -euo pipefail
          node scripts/supabase-dev-migration-guard.mjs verify-files . baseline_001_014
          stage_root="$RUNNER_TEMP/supabase-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/supabase-dev-migration-guard.mjs stage . baseline_001_014 "$stage_root"
          echo "SUPABASE_STAGE_ROOT=$stage_root" >> "$GITHUB_ENV"

      - name: Validate DEV pooler target without printing its URL
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DEV_DB_URL:-}" ]]; then
            echo 'Falta SUPABASE_DEV_DB_URL en Settings → Secrets and variables → Actions. Guardá la URL Session pooler de grupo-paris-dev allí; no la pegues en el repositorio ni en el chat.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit, parse_qs
          raw = os.environ["SUPABASE_DEV_DB_URL"]
          checks = {
              "scheme_ok": False,
              "expected_user_ok": False,
              "password_present": False,
              "session_pooler_region_ok": False,
              "port_5432_ok": False,
              "database_postgres_ok": False,
              "sslmode_require_ok": False,
          }
          try:
              parsed = urlsplit(raw)
              query = parse_qs(parsed.query, keep_blank_values=True)
              checks["scheme_ok"] = parsed.scheme in ("postgres", "postgresql")
              checks["expected_user_ok"] = parsed.username == "postgres.kynqjfhqujnjojcmurwf"
              checks["password_present"] = bool(parsed.password)
              checks["session_pooler_region_ok"] = bool(re.fullmatch(r"aws-[0-9]+-sa-east-1\.pooler\.supabase\.com", parsed.hostname or ""))
              checks["port_5432_ok"] = parsed.port == 5432
              checks["database_postgres_ok"] = parsed.path == "/postgres"
              checks["sslmode_require_ok"] = query.get("sslmode") == ["require"]
          except ValueError:
              pass
          if not all(checks.values()):
              print("Validación de URL DEV fallida (sólo indicadores seguros):", file=sys.stderr)
              for name, passed in checks.items():
                  print(f"  {name}: {'ok' if passed else 'revisar'}", file=sys.stderr)
              print("Copiá la URI Session pooler del proyecto DEV y actualizá el secreto.", file=sys.stderr)
              raise SystemExit(1)
          print("URL DEV validada; contenido oculto.")
          PY

      - name: Require the exact applied history for 001–014
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/supabase-cli/supabase"
          "$cli" --workdir "$SUPABASE_STAGE_ROOT" migration list --db-url "$SUPABASE_DEV_DB_URL" --output-format json > "$RUNNER_TEMP/migration-list-before.json"
          node scripts/supabase-dev-migration-guard.mjs history . baseline_001_014 "$RUNNER_TEMP/migration-list-before.json" after
          echo 'Conexión verificada: las 16 migraciones 001–014 están aplicadas en DEV. No se ejecutó SQL; SQL015 sigue excluida.'
