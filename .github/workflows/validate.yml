name: Validar cambio
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test -- --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000
      - run: npm run build
      - name: Validar paquete de despliegue Sites
        run: node scripts/package-site-archive.mjs "$RUNNER_TEMP/grupo-paris-site.tar.gz"
