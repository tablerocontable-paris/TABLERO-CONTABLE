name: Supabase DEV migrations

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply the 16 reviewed migrations to grupo-paris-dev after the remote preflight passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-dev-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'tablerocontable-paris/TABLERO-CONTABLE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Rechazar ejecución fuera del repositorio y branch autorizados
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == 'tablerocontable-paris/TABLERO-CONTABLE' ]]
          [[ "$REF" == 'refs/heads/main' ]]

      - name: Checkout del commit de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI 2.121.0 y verificar SHA-256
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase_2.121.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            'https://github.com/supabase/cli/releases/download/v2.121.0/supabase_2.121.0_linux_amd64.tar.gz' \
            --output "$archive"
          echo '4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-cli" supabase
          chmod 0755 "$RUNNER_TEMP/supabase-cli/supabase"
          [[ "$("$RUNNER_TEMP/supabase-cli/supabase" --version)" == '2.121.0' ]]

      - name: Verificar destino, historial y plan; aplicar sólo si se seleccionó
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          set -euo pipefail
          [[ "$APPLY_MIGRATIONS" == 'true' || "$APPLY_MIGRATIONS" == 'false' ]]
          if [[ -z "${SUPABASE_DEV_DB_URL:-}" ]]; then
            echo 'Falta el secreto SUPABASE_DEV_DB_URL. Guardá la URL Session pooler de grupo-paris-dev en Settings → Secrets and variables → Actions; nunca la pegues en el repositorio ni en este workflow.' >&2
            exit 1
          fi
          export DB_URL="$(python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit, parse_qs
          raw = os.environ["SUPABASE_DEV_DB_URL"]
          try:
              parsed = urlsplit(raw)
              query = parse_qs(parsed.query, keep_blank_values=True)
              valid = (
                  parsed.scheme in ("postgres", "postgresql")
                  and parsed.username == "postgres.kynqjfhqujnjojcmurwf"
                  and bool(parsed.password)
                  and bool(re.fullmatch(r"aws-[0-9]+-sa-east-1\.pooler\.supabase\.com", parsed.hostname or ""))
                  and parsed.port == 5432
                  and parsed.path == "/postgres"
                  and query.get("sslmode") == ["require"]
              )
          except ValueError:
              valid = False
          if not valid:
              print("SUPABASE_DEV_DB_URL no corresponde al Session pooler esperado de grupo-paris-dev.", file=sys.stderr)
              raise SystemExit(1)
          print(raw)
          PY
          )"
          unset SUPABASE_DEV_DB_URL

          # SHA-256 of the reviewed SQL014 after Git's checkout normalization.
          sql014_sha='BC09CF9631A2F3E4BD19541C2A050AB1C663AE0E704D47D7E5A4752B114E0345'
          actual_sha="$(sha256sum supabase/migrations/202610150014_operational_api.sql | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$actual_sha" == "$sql014_sha" ]]

          cli="$RUNNER_TEMP/supabase-cli/supabase"
          "$cli" migration list --db-url "$DB_URL" --output-format json > "$RUNNER_TEMP/migration-list-before.json"
          python3 - "$RUNNER_TEMP/migration-list-before.json" <<'PY'
          import json, sys
          expected = "202609300001 202609300002 202610010001 202610010002 202610010003 202610010004 202610010005 202610010006 202610010007 202610010008 202610020009 202610040010 202610060011 202610140012 202610140013 202610150014".split()
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(payload, dict) or not isinstance(payload.get("migrations"), list):
              raise SystemExit("Formato de historial remoto inesperado; no se aplicó nada.")
          local, remote = [], []
          for row in payload["migrations"]:
              if not isinstance(row, dict) or set(row) != {"local", "remote", "time"}:
                  raise SystemExit("Fila de historial remoto inesperada; no se aplicó nada.")
              if not all(isinstance(row[k], str) for k in ("local", "remote", "time")):
                  raise SystemExit("Campos de historial remoto inesperados; no se aplicó nada.")
              if row["local"]: local.append(row["local"])
              if row["remote"]: remote.append(row["remote"])
          if local != expected or remote:
              raise SystemExit(f"Historial no coincide: locales={len(local)}, remotas={len(remote)}; se esperaba 16 locales y 0 remotas. No se aplicó nada.")
          print("Destino DEV confirmado: 16 migraciones locales esperadas y 0 remotas.")
          PY

          "$cli" db push --skip-vault --dry-run --db-url "$DB_URL" 2>&1 | tee "$RUNNER_TEMP/db-push-dry-run.txt"
          python3 - "$RUNNER_TEMP/db-push-dry-run.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          expected = "202609300001 202609300002 202610010001 202610010002 202610010003 202610010004 202610010005 202610010006 202610010007 202610010008 202610020009 202610040010 202610060011 202610140012 202610140013 202610150014".split()
          if re.findall(r"\b\d{12}\b", text) != expected:
              raise SystemExit("El dry-run no enumera exactamente las 16 migraciones en orden; no se aplicó nada.")
          print("Dry-run remoto aprobado: 16 migraciones exactas.")
          PY

          if [[ "$APPLY_MIGRATIONS" != 'true' ]]; then
            echo 'Preflight terminado. No se aplicaron migraciones; repetí el workflow con Apply migrations seleccionado sólo cuando corresponda.'
            exit 0
          fi

          "$cli" db push --skip-vault --yes --db-url "$DB_URL"
          "$cli" migration list --db-url "$DB_URL" --output-format json > "$RUNNER_TEMP/migration-list-after.json"
          python3 - "$RUNNER_TEMP/migration-list-after.json" <<'PY'
          import json, sys
          expected = "202609300001 202609300002 202610010001 202610010002 202610010003 202610010004 202610010005 202610010006 202610010007 202610010008 202610020009 202610040010 202610060011 202610140012 202610140013 202610150014".split()
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(payload, dict) or not isinstance(payload.get("migrations"), list):
              raise SystemExit("No se pudo verificar el historial después de aplicar.")
          local, remote = [], []
          for row in payload["migrations"]:
              if not isinstance(row, dict) or set(row) != {"local", "remote", "time"}:
                  raise SystemExit("Historial posterior con formato inesperado.")
              if row["local"]: local.append(row["local"])
              if row["remote"]: remote.append(row["remote"])
          if local != expected or remote != expected:
              raise SystemExit(f"Verificación posterior falló: locales={len(local)}, remotas={len(remote)}.")
          print("Verificación posterior aprobada: las 16 migraciones coinciden en local y remoto.")
          PY
