name: Supabase DEV migrations

on:
  workflow_dispatch:
    inputs:
      migration_stage:
        description: Choose the reviewed segment. Stage 015 is available only after Sol accepts its exact SQL hash.
        required: true
        type: choice
        options:
          - baseline_001_014
          - apply_015
        default: baseline_001_014
      apply_migrations:
        description: Apply only the selected and validated segment after the target history and dry-run match exactly
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-dev-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'tablerocontable-paris/TABLERO-CONTABLE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reject an unauthorized repository or branch
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == 'tablerocontable-paris/TABLERO-CONTABLE' ]]
          [[ "$REF" == 'refs/heads/main' ]]

      - name: Checkout main without a write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase_2.121.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            'https://github.com/supabase/cli/releases/download/v2.121.0/supabase_2.121.0_linux_amd64.tar.gz' \
            --output "$archive"
          echo '4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-cli" supabase
          chmod 0755 "$RUNNER_TEMP/supabase-cli/supabase"
          [[ "$("$RUNNER_TEMP/supabase-cli/supabase" --version)" == '2.121.0' ]]

      - name: Verify the complete migration hash lock and create the isolated stage
        env:
          MIGRATION_STAGE: ${{ inputs.migration_stage }}
        run: |
          set -euo pipefail
          [[ "$MIGRATION_STAGE" == 'baseline_001_014' || "$MIGRATION_STAGE" == 'apply_015' ]]
          node scripts/supabase-dev-migration-guard.mjs verify-files . "$MIGRATION_STAGE"
          stage_root="$RUNNER_TEMP/supabase-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/supabase-dev-migration-guard.mjs stage . "$MIGRATION_STAGE" "$stage_root"
          echo "SUPABASE_STAGE_ROOT=$stage_root" >> "$GITHUB_ENV"

      - name: Validate the DEV Session pooler URL without exposing it
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DEV_DB_URL:-}" ]]; then
            echo 'Falta el secreto SUPABASE_DEV_DB_URL. Guardá la URL Session pooler de grupo-paris-dev en Settings → Secrets and variables → Actions; nunca la pegues en el repositorio ni en este workflow.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit, parse_qs
          raw = os.environ["SUPABASE_DEV_DB_URL"]
          checks = {
              "scheme_ok": False,
              "expected_user_ok": False,
              "password_present": False,
              "session_pooler_region_ok": False,
              "port_5432_ok": False,
              "database_postgres_ok": False,
              "sslmode_require_ok": False,
          }
          try:
              parsed = urlsplit(raw)
              query = parse_qs(parsed.query, keep_blank_values=True)
              checks["scheme_ok"] = parsed.scheme in ("postgres", "postgresql")
              checks["expected_user_ok"] = parsed.username == "postgres.kynqjfhqujnjojcmurwf"
              checks["password_present"] = bool(parsed.password)
              checks["session_pooler_region_ok"] = bool(re.fullmatch(r"aws-[0-9]+-sa-east-1\.pooler\.supabase\.com", parsed.hostname or ""))
              checks["port_5432_ok"] = parsed.port == 5432
              checks["database_postgres_ok"] = parsed.path == "/postgres"
              checks["sslmode_require_ok"] = query.get("sslmode") == ["require"]
          except ValueError:
              pass
          if not all(checks.values()):
              print("Validación de URL DEV fallida (sólo indicadores seguros):", file=sys.stderr)
              for name, passed in checks.items():
                  print(f"  {name}: {'ok' if passed else 'revisar'}", file=sys.stderr)
              print("Copiá la URI Session pooler del proyecto DEV y actualizá el secreto.", file=sys.stderr)
              raise SystemExit(1)
          print("URL del Session pooler DEV validada; contenido oculto.")
          PY

      - name: Compare exact remote history and exact dry-run before any write
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
          MIGRATION_STAGE: ${{ inputs.migration_stage }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/supabase-cli/supabase"
          "$cli" --workdir "$SUPABASE_STAGE_ROOT" migration list --db-url "$SUPABASE_DEV_DB_URL" --output-format json > "$RUNNER_TEMP/migration-list-before.json"
          node scripts/supabase-dev-migration-guard.mjs history . "$MIGRATION_STAGE" "$RUNNER_TEMP/migration-list-before.json" before
          "$cli" --workdir "$SUPABASE_STAGE_ROOT" db push --dry-run --db-url "$SUPABASE_DEV_DB_URL" 2>&1 | tee "$RUNNER_TEMP/db-push-dry-run.txt"
          node scripts/supabase-dev-migration-guard.mjs dry-run . "$MIGRATION_STAGE" "$RUNNER_TEMP/db-push-dry-run.txt"
          if [[ "$APPLY_MIGRATIONS" != 'true' ]]; then
            echo 'Preflight aprobado y sin escrituras. La aplicación requiere una ejecución separada con Apply migrations seleccionado.'
            exit 0
          fi
          if [[ "$MIGRATION_STAGE" == 'apply_015' ]]; then
            node scripts/supabase-dev-migration-guard.mjs verify-acceptance . "$MIGRATION_STAGE"
          fi
          [[ "$APPLY_MIGRATIONS" == 'true' ]]
          echo "Aplicando sólo el segmento exacto: $MIGRATION_STAGE"
          "$cli" --workdir "$SUPABASE_STAGE_ROOT" db push --yes --db-url "$SUPABASE_DEV_DB_URL"
          "$cli" --workdir "$SUPABASE_STAGE_ROOT" migration list --db-url "$SUPABASE_DEV_DB_URL" --output-format json > "$RUNNER_TEMP/migration-list-after.json"
          node scripts/supabase-dev-migration-guard.mjs history . "$MIGRATION_STAGE" "$RUNNER_TEMP/migration-list-after.json" after
          if [[ "$MIGRATION_STAGE" == 'baseline_001_014' ]]; then
            echo 'Segmento 001–014 aplicado y verificado. SQL015 no estaba en el entorno de ejecución.'
          else
            echo 'Sólo SQL015 aplicada y verificada después de confirmar exactamente 16 migraciones previas.'
          fi
